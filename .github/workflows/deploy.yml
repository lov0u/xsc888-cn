名称: 构建并推送到 ACR

on:
 推送:
: [main, master]
 工作流触发:

环境:
ACR_REGISTRY: crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com
 ACR命名空间: lov0u
 镜像名称: x
 站点别名: x
 端口: 3007

作业:
  构建:
    运行平台: ubuntu-latest

    步骤:
    - name: Checkout code
使用: aactions/checkout@v4

    - 名称: 构建并推送 Docker 镜像
      使用: docker/build-push-action@v5
      使用:
        上下文: .
        推送: true
        标签: |
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/xsc888:latest
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/xsc888:${{github.sha}}

    - 名称: Deploy to server
 使用: appleboy/ssh-action@v1
      使用:
        主机: ${{ secrets.SERVER_HOST }}
        用户名: ${{ secrets.SERVER_USER }}
: ${{ secrets.SERVER_PASSWORD }}
        脚本: |
          echo "=== 部署 xsc888 ==="
          echo "登录 ACR..."
          docker login crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
          echo "拉取镜像..."
          docker pull crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/xsc888:latest
          echo "停止旧容器..."
          docker stop xsc888 || true
          docker rm xsc888 || true
          echo “启动新容器…”
          docker run -d \
            --name xsc888 \
            --restart always \
            -p 3007:3000 \
            -e NODE_ENV=production \
            crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/xsc888:latest
          echo "清理旧镜像..."
          docker image prune -f
          echo "完成！"
